<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic JavaScript Example</title>
  <style>
    #dynamic-paragraph {
      color: navy;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="main-title">Welcome to My Page</h1>
  </header>

  <nav>
    <a href="#">Home</a> |
    <a href="#">About</a>
  </nav>

  <main>
    <section>
      <p id="dynamic-paragraph">This paragraph will change dynamically.</p>
      <button id="change-text-btn">Change Text</button>
    </section>

    <section>
      <button id="add-element-btn">Add Element</button>
      <button id="remove-element-btn">Remove Element</button>
      <div id="container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Tosin Williams</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
